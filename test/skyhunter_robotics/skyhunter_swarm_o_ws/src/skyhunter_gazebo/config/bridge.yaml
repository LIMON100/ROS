# Mapping ROS topics to Gazebo topics

# Robot 1 (Leader)
- ros_topic_name: "/robot1/cmd_vel"
  gz_topic_name: "/model/skyhunter_1/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/robot1/odom"
  gz_topic_name: "/model/skyhunter_1/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot1/scan/points"
  gz_topic_name: "/world/rough_terrain/model/skyhunter_1/link/lidar_link/sensor/lidar_sensor/scan/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

