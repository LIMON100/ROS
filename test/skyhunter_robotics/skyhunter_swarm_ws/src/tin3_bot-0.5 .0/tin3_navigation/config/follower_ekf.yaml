### follower_ekf.yaml ###
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    publish_tf: true
    
    # Frames (These will be overridden by launch file, but good to have defaults)
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ODOMETRY INPUT
    odom0: odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10