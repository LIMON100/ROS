# Configuration for ekf_filter_node
# See robot_localization documentation for details:
# http://docs.ros.org/en/humble/p/robot_localization/
ekf_filter_node:
  ros__parameters:
    # --- GENERAL PARAMETERS ---
    frequency: 30.0                  # The rate at which the filter will run
    sensor_timeout: 0.1              # How long to wait for a sensor before timing out
    two_d_mode: true                 # We are a ground robot, so operate in 2D (x, y, yaw)
    transform_time_offset: 0.0
    print_diagnostics: true

    # --- FRAME PARAMETERS ---
    map_frame: map                   # The world-fixed frame. We won't use this yet.
    odom_frame: odom                 # The odometry frame (where the robot started)
    base_link_frame: base_link       # The robot's main body frame
    world_frame: odom                # We will publish the odom -> base_link transform

    # --- ODOMETRY INPUT (from wheels) ---
    # The /odom topic from your differential drive plugin
    odom0: /odom
    odom0_config: [false, false, false,  # Do not use X, Y, Z position from wheels
                   false, false, false,  # Do not use Roll, Pitch, Yaw orientation
                   true,  true,  false,  # Use X velocity and Y velocity (for skid steer)
                   false, false, true,   # Do not use Z velocity, Roll/Pitch vel, but USE Yaw velocity
                   false, false, false]  # Do not use accelerations
    odom0_differential: false        # The odometry is not a velocity, it's a pose
    odom0_relative: false

    # --- IMU INPUT ---
    # The /imu/data topic from your Gazebo IMU plugin
    imu0: /imu/data
    imu0_config: [false, false, false,  # Do not use X, Y, Z position from IMU
                  true,  true,  true,   # USE Roll, Pitch, and Yaw orientation
                  false, false, false,  # Do not use linear velocities
                  true,  true,  true,   # USE angular velocities
                  false, false, false]  # Do not use linear accelerations
    imu0_differential: false         # The IMU gives absolute orientation
    imu0_relative: false             # Orientation is relative to the world frame (gravity)
    imu0_remove_gravitational_acceleration: true # The filter will remove the 9.8 m/s^2 from the Z-axis

    # --- PUBLISH PARAMETERS ---
    publish_tf: true                 # The filter will publish the odom -> base_link transform