slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI

    odom_frame: robot_01/odom             # <--- CHANGED: Added prefix
    map_frame: map                        # Keep 'map' global
    base_frame: robot_01/base_footprint   # <--- CHANGED: Added prefix & changed to base_footprint (standard for Nav2)
    scan_topic: /robot_01/scan 

    use_sim_time: True    # IMPORTANT for simulation

    # Mode: Can be mapping or localization
    mode: mapping 

    # General Parameters
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.0
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 30.0 
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    use_scan_matching: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.1
    
    # Loop Closure Parameters
    do_loop_closing: true 
    loop_match_minimum_response_coarse: 0.35    
    loop_match_minimum_response_fine: 0.45
    loop_search_maximum_distance: 4.0