ekf_filter_node_odom:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint 
    world_frame: odom

    odom0: odom
    odom0_config: [true,  true,  false, false, false, true, false, false, false, false, false, false, false, false, false]
    odom0_queue_size: 10
    odom0_differential: false 

    imu0: imu/data
    imu0_config: [false, false, false, true,  true,  true, false, false, false, true,  true,  true, false, false, false]
    imu0_differential: false

ekf_filter_node_map:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint 
    world_frame: map

    odom0: odom
    odom0_config: [true,  true,  false, false, false, true, false, false, false, false, false, false, false, false, false]
    odom0_queue_size: 10
    odom0_differential: true 

    odom1: odometry/gps      
    odom1_config: [true,  true,  false, false, false, false, false, false, false, false, false, false, false, false, false]
    odom1_queue_size: 10
    odom1_differential: false

navsat_transform:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    delay: 3.0 
    magnetic_declination_radians: 0.0 
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_cartesian_transform: false 
    publish_filtered_gps: true
    use_odometry_yaw: true 
    wait_for_datum: true
    datum: [36.61002559225, 127.28772570583, 0.0]
    base_link_frame: base_footprint
    world_frame: map