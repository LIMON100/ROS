ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map        # <--- CRITICAL: Set to map
    map_frame: map
    frequency: 30.0         
    publish_tf: true        
    publish_acceleration: true
    two_d_mode: false       # Keep false for 3D hills

    # Wheel Odom
    odom0: odom
    odom0_config: [true, true, false, false, false, false, true, false, false, false, false, true, false, false, false]
    odom0_differential: false    
    odom0_relative: false        

    # IMU
    imu0: imu/data
    imu0_config: [false, false, false, true, true, false, false, false, false, true, true, true, false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    # GPS (Converted to local Odometry)
    odom1: odometry/gps
    odom1_config: [true, true, false, false, false, false, false, false, false, false, false, false, false, false, false]
    odom1_differential: false
    odom1_relative: false

# Client Requested Node to convert Lat/Long to X/Y
navsat_transform_node:
  ros__parameters:
    use_sim_time: true
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: true
    datum: [36.61002559225, 127.28772570583, 0.0]