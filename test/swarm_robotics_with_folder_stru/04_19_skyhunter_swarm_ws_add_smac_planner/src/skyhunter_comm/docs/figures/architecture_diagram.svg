<!-- ══════════════════════════════════════
     CONNECTIONS
     Top route:    y=50  (above all boxes, below title)
     Bottom route: y=480 and y=500
══════════════════════════════════════ -->

<!-- 1. ROBOTS → W6  (TF lookups) -->
<polyline points="185,137 208,137 208,265 228,265"
  fill="none" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arr)"/>
<text x="197" y="200" text-anchor="middle" font-size="10" fill="#4a6fa5" font-weight="bold" transform="rotate(-90,197,200)">TF lookup</text>

<!-- 2. TF → W6 -->
<polyline points="185,230 208,230 208,275 228,275"
  fill="none" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arr)"/>

<!-- 3. JAM → W6  (vertical within RF) -->
<line x1="314" y1="198" x2="314" y2="228" stroke="#27ae60" stroke-width="2" marker-end="url(#arr)"/>
<text x="332" y="218" font-size="10" fill="#27ae60" font-weight="bold">/jammed_links</text>

<!-- 4+8. W6 → FSM (/mesh_metrics) and W6 → FILTER (/mesh_link_states)
     Shared bottom route with T-split at Decision column -->

<!-- Stem: W6 bottom → down to shared horizontal -->
<line x1="314" y1="298" x2="314" y2="480"
  stroke="#27ae60" stroke-width="2"/>

<!-- Shared horizontal backbone -->
<line x1="314" y1="480" x2="959" y2="480"
  stroke="#27ae60" stroke-width="2"/>

<!-- Branch 1: up to FSM (Decision) — /mesh_metrics -->
<line x1="744" y1="480" x2="744" y2="252"
  stroke="#27ae60" stroke-width="2" marker-end="url(#arr)"/>
<text x="757" y="370" font-size="10.5" fill="#27ae60" font-weight="bold">/mesh_metrics  10 Hz</text>

<!-- Branch 2: /mesh_link_states — outside output box, enter filter from right -->
<polyline points="930,480 1075,480 1075,168 1043,168"
  fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr)"/>
<text x="1087" y="330" text-anchor="middle" font-size="10.5" fill="#27ae60" font-weight="bold" transform="rotate(-90,1087,330)">/mesh_link_states  1 Hz</text>

<!-- T-junction dots -->
<circle cx="744" cy="480" r="4" fill="#27ae60"/>
<circle cx="930" cy="480" r="4" fill="#27ae60"/>

<!-- 5. LTE → FSM -->
<polyline points="613,140 637,140 637,200 658,200"
  fill="none" stroke="#e67e22" stroke-width="2" marker-end="url(#arr)"/>
<text x="625" y="130" text-anchor="middle" font-size="10.5" fill="#e67e22" font-weight="bold">/lte_status  2 Hz</text>

<!-- 6. LORA → FSM -->
<polyline points="613,262 637,262 637,225 658,225"
  fill="none" stroke="#e67e22" stroke-width="2" marker-end="url(#arr)"/>
<text x="625" y="282" text-anchor="middle" font-size="10.5" fill="#e67e22" font-weight="bold">/lora/status</text>

<!-- 7. FSM → FILTER -->
<polyline points="828,212 851,212 851,178 873,178"
  fill="none" stroke="#8e44ad" stroke-width="2" marker-end="url(#arr)"/>
<text x="851" y="200" text-anchor="start" font-size="10.5" fill="#8e44ad" font-weight="bold"> /comm_state</text>



<!-- 9. RT → FILTER — outside output box, enter filter from right -->
<polyline points="185,333 207,333 207,500 1090,500 1090,185 1043,185"
  fill="none" stroke="#4a6fa5" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr)"/>
<text x="583" y="516" text-anchor="middle" font-size="10.5" fill="#4a6fa5" font-weight="bold">/SH_NN/odom · /SH_NN/camera · /SH_NN/cmd_vel  (× 8)</text>

<!-- 10. FILTER → OUT -->
<line x1="959" y1="206" x2="959" y2="240" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>

