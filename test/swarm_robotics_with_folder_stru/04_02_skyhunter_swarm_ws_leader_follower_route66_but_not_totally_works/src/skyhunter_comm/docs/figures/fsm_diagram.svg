<svg width="1060" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#333"/>
  </marker>
  <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#c0392b"/>
  </marker>
  <marker id="arr-grn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#27ae60"/>
  </marker>
</defs>

<!-- Background -->
<rect width="1060" height="340" fill="#f8f9fa" rx="10"/>

<!-- Title -->
<text x="530" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">SkyHunter Comm — Communication Tier FSM</text>

<!-- ═══════════════ STATE BOXES ═══════════════ -->

<!-- WiFi6: x=80-220, center=150, y=120-180 -->
<rect x="80"  y="120" width="140" height="60" rx="8" fill="white" stroke="#2c3e50" stroke-width="2"/>
<text x="150" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">WiFi6</text>
<text x="150" y="164" text-anchor="middle" font-size="11" fill="#7f8c8d">Tier 1</text>

<!-- LTE: x=330-470, center=400, y=120-180 -->
<rect x="330" y="120" width="140" height="60" rx="8" fill="white" stroke="#2c3e50" stroke-width="2"/>
<text x="400" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">LTE</text>
<text x="400" y="164" text-anchor="middle" font-size="11" fill="#7f8c8d">Tier 2</text>

<!-- LoRa: x=580-720, center=650, y=120-180 -->
<rect x="580" y="120" width="140" height="60" rx="8" fill="white" stroke="#2c3e50" stroke-width="2"/>
<text x="650" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">LoRa</text>
<text x="650" y="164" text-anchor="middle" font-size="11" fill="#7f8c8d">Tier 3</text>

<!-- DISC: x=830-1010, center=920, y=120-180 -->
<rect x="830" y="120" width="185" height="60" rx="8" fill="white" stroke="#2c3e50" stroke-width="2"/>
<text x="922" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">DISCONNECTED</text>
<text x="922" y="164" text-anchor="middle" font-size="11" fill="#7f8c8d">Tier 0</text>

<!-- ═══════════════ INITIAL STATE ═══════════════ -->
<circle cx="35" cy="150" r="11" fill="#2c3e50"/>
<line x1="46" y1="150" x2="78" y2="150" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
<text x="62" y="144" text-anchor="middle" font-size="9" fill="#555">boot</text>

<!-- ═══════════════ FORWARD / DEGRADATION (y=170, going right) ═══════════════ -->

<!-- WiFi6 → LTE -->
<line x1="220" y1="170" x2="328" y2="170" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr-red)"/>
<text x="274" y="188" text-anchor="middle" font-size="9.5" fill="#c0392b">[RSSI &lt; −75 dBm / 3 s]</text>

<!-- LTE → LoRa -->
<line x1="470" y1="170" x2="578" y2="170" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr-red)"/>
<text x="524" y="188" text-anchor="middle" font-size="9.5" fill="#c0392b">[LTE down / 10 s]</text>

<!-- LoRa → DISC -->
<line x1="720" y1="170" x2="828" y2="170" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr-red)"/>
<text x="774" y="188" text-anchor="middle" font-size="9.5" fill="#c0392b">[heartbeat timeout]</text>

<!-- ═══════════════ RECOVERY (y=130, going left) ═══════════════ -->

<!-- LTE → WiFi6 -->
<line x1="330" y1="130" x2="222" y2="130" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arr-grn)"/>
<text x="276" y="122" text-anchor="middle" font-size="9.5" fill="#27ae60">[RSSI &gt; −65 dBm / 5 s]</text>

<!-- LoRa → LTE -->
<line x1="580" y1="130" x2="472" y2="130" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arr-grn)"/>
<text x="526" y="122" text-anchor="middle" font-size="9.5" fill="#27ae60">[LTE recovers]</text>

<!-- ═══════════════ DISC RECOVERY — U-shape below ═══════════════ -->
<!-- DISC bottom → down → left → WiFi6 bottom -->
<polyline points="922,180 922,255 150,255 150,182"
  stroke="#27ae60" stroke-width="1.8" fill="none" marker-end="url(#arr-grn)"/>
<text x="536" y="275" text-anchor="middle" font-size="9.5" fill="#27ae60">[best available tier — WiFi6 / LTE / LoRa]</text>

<!-- LoRa → WiFi6 — U-shape above -->
<polyline points="650,120 650,80 150,80 150,118"
  stroke="#27ae60" stroke-width="1.8" fill="none" marker-end="url(#arr-grn)"/>
<text x="400" y="72" text-anchor="middle" font-size="9.5" fill="#27ae60">[WiFi6 recovered / 5 s]</text>

<!-- ═══════════════ LEGEND ═══════════════ -->
<rect x="80" y="300" width="12" height="2" fill="#c0392b"/>
<text x="98" y="306" font-size="10" fill="#555">Degradation</text>
<rect x="200" y="300" width="12" height="2" fill="#27ae60"/>
<text x="218" y="306" font-size="10" fill="#555">Recovery</text>

</svg>
