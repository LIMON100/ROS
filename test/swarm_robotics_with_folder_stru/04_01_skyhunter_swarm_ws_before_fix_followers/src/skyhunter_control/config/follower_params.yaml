/**:
  ros__parameters:
    # Formation parameters
    offset_x: -2.0
    offset_y: 2.0
    min_safe_distance: 1.2
    comfort_distance: 2.0
    
    # Control gains
    formation_k_v: 1.5
    formation_k_w: 2.0
    velocity_match_gain: 0.8
    angular_match_gain: 0.7
    
    # Limits
    max_linear_vel: 0.8
    max_angular_vel: 1.5
    braking_distance: 1.5
    
    # Behavior
    predictive_braking: true
    enable_collision_avoidance: true
    formation_tolerance: 0.3
    lost_timeout: 2.0
    recovery_timeout: 5.0
    
    # Topics
    leader_topic: "/robot1/leader_state"
    odom_topic: "odom"
    cmd_vel_topic: "cmd_vel"
    
    # Frames
    leader_frame: "robot1/base_link"
    follower_frame: "base_link"