# --- Global Costmap (FLAT ground) ---
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      rolling_window: true
      width: 100
      height: 100
      resolution: 0.1
      track_unknown_space: false
      footprint: "[[0.657, 0.425], [0.657, -0.425], [-0.657, -0.425], [-0.657, 0.425]]"
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: -30.0 # 0.0
        z_resolution: 0.1
        z_voxels: 350 #16
        max_obstacle_height: 2.0
        min_obstacle_height: 0.5
        mark_threshold: 0
        observation_sources: pointcloud
        pointcloud:
          # topic: scan/points
          topic: scan/points_filtered
          data_type: "PointCloud2"
          max_obstacle_height: 3.0 #2.0
          min_obstacle_height: -30.0 #0.5
          obstacle_max_range: 25.0
          obstacle_min_range: 0.2
          clearing: true
          marking: true
          raytrace_max_range: 30.0
          raytrace_min_range: 0.1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0

# --- Local Costmap (Rolling Window) ---
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[[0.657, 0.425], [0.657, -0.425], [-0.657, -0.425], [-0.657, 0.425]]"
      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: -30.0 #0.0
        z_resolution: 0.1
        z_voxels: 350 #16
        max_obstacle_height: 2.0
        min_obstacle_height: 0.5
        mark_threshold: 0
        observation_sources: pointcloud
        pointcloud:
          # topic: scan/points
          topic: scan/points_filtered
          data_type: "PointCloud2"
          max_obstacle_height: 3.0 #2.0
          min_obstacle_height: -30.0 #0.5
          obstacle_max_range: 10.0
          obstacle_min_range: 0.2
          clearing: true
          marking: true
          raytrace_max_range: 12.0
          raytrace_min_range: 0.1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8

# --- Behavior Server (Recovery Behaviors) ---
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.5

# --- Waypoint Follower ---
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

# --- Velocity Smoother ---
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [1.94, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [1.0, 0.0, 1.5]
    max_decel: [-1.5, 0.0, -2.0]
    odom_topic: odom_filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]

# --- Smoother Server ---
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true