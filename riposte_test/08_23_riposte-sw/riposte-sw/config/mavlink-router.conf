# mavlink-router: single MAVLink hub on the RK3588 (RIPOSTE-SAD-001 §5.1).
# GCS(SiK/USB) <-> FC(Ethernet/UDP) <-> OBC(local UDP). No endpoint talks direct.

[General]
TCPServerPort = 0
ReportStats = false
MavlinkDialect = common

# --- GCS link: SiK 433 MHz radio on USB (udev-fixed device name) ---
[UartEndpoint sik]
Device = /dev/riposte-sik
Baud = 57600

# --- Flight controller: PX4 over Ethernet ---
# PX4 MAV_2_CONFIG=Ethernet sends to this host:port; we also send back here.
[UdpEndpoint fc]
Mode = Server
Address = 0.0.0.0
Port = 14550

# --- OBC (MAVSDK) local loopback endpoint ---
[UdpEndpoint obc]
Mode = Normal
Address = 127.0.0.1
Port = 14540
