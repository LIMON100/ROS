# Riposte SIL profile — hardware-free development (RIPOSTE-SAD-001).
# SyntheticCamera/SyntheticDetector/SIL FcuLink stubs, whole pipeline on a host.
#
#   export RIPOSTE_OBC_SOCKET=/tmp/riposte-obc.sock   # when /run is not writable
#   ./build/riposte-seeker config/sil.ini &
#   ./build/riposte-obc    config/sil.ini &
#
# This profile is the ONLY place synthetic=true belongs. The deployed production
# profile is config/riposte.ini (synthetic=false, fail-closed startup); the
# seeker also publishes the synthetic flag on the HealthBus so a SIL run can
# never be mistaken for real perception downstream.

[seeker]
synthetic     = true
width         = 1280
height        = 720
target_class  = 0
# No recording in SIL: the recorder is not implemented and record=true is a
# refused startup (fail-closed) until it lands.
record        = false

[obc]
connection_url = udpin://0.0.0.0:14540
source         = guidance
cmd_socket     = /tmp/riposte-obc.sock
operator_token = sil-dev-token # engage stays token-gated even in SIL (D-2)

[safety]
vmax_h          = 8.0
vmax_v          = 3.0
geofence_r      = 150.0
alt_min         = 2.0
alt_max         = 60.0
engage_timebox_s = 300.0
