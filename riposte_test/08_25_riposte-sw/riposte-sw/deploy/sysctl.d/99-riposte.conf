# sysctl.d(5) — install to /etc/sysctl.d/ (applied at boot; `sysctl --system`
# to apply now).
#
# VideoRecorder feeds raw NV12 frames to ffmpeg through a pipe and only writes
# when a WHOLE frame fits (SEEKER-SDD §8.1, never-block contract). A 720p NV12
# frame is 1.38 MB — above the kernel's default fs.pipe-max-size of 1 MB — so
# without this the recorder cannot grow the pipe past one frame and disables
# itself at startup. 16 MB leaves room for 4 frames of dual 720p.
fs.pipe-max-size = 16777216
