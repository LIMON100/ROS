# Riposte — balloon trial configuration (RIPOSTE-DUALEO-REQ-001 T-1..T-5).
#
# Overlay for the outdoor test flights: a 50 x 50 m geofence, red balloons as
# targets, and the patrol behaviour that flies at one, turns away at the fence
# and goes looking for the next. Everything not set here keeps the compiled
# default from common/include/riposte/Tunables.h.
#
#   riposte-obc    config/balloon.ini
#   riposte-seeker config/balloon.ini
#
# BEFORE FLYING:
#   1. Set obc.operator_token — engage is denied without it (D-2).
#   2. Survey the range and put its corners in fence.polygon, or leave the
#      polygon empty to get a 50 m square centred on the engage point.
#   3. Mirror the boundary into PX4's own geofence (GF_*) as the outer layer.
#   4. Point seeker.hef at the balloon-trained model and set seeker.target_class
#      to that model's balloon class.

[seeker]
synthetic     = false
device        = /dev/video0
width         = 1280
height        = 720
hef           = config/balloon.hef
score_thr     = 0.40
hfov_rad      = 1.05
target_size_m = 0.25          # T-2: 25 cm balloon (monocular range basis)
target_class  = 0             # balloon class id in the trial model
# Wide pass first, then a 3x3 sweep — a 25 cm balloon is only ~57 m detectable
# on the wide camera even tiled (REQ-001 §3), which is inside this range anyway.
search_grid          = 3
search_wide_dwell    = 2
confirm_window       = 5
confirm_hits         = 4
track_recheck_period = 15
# Record the trial: it is the primary evidence for what the seeker actually
# saw. Fail-closed: if ffmpeg/the directory is unavailable at startup the
# seeker REFUSES to start rather than fly believing it is recording (P1-07).
# 720p NV12 frames exceed the default fs.pipe-max-size — install
# deploy/sysctl.d/99-riposte.conf on the target or recording disables itself.
record        = true
record_dir    = /var/lib/riposte/rec
record_codec  = h264_rkmpp

[obc]
connection_url = udpin://0.0.0.0:14540
source         = balloon
operator_token =              # REQUIRED — set before flight
rt_priority    = 80
cpu_affinity   = 4

[fence]
# Surveyed corners of the flight area, or leave empty for a square about the
# engage point. A polygon needs a FRESH GPS fix at engage: without one the
# engage is REFUSED rather than run with SM-10 disabled (CR-04) — configuring a
# boundary is a decision to fly inside it. Leave it empty to fly on SM-3 alone.
polygon =
side_m  = 50                  # T-1 default: 50 x 50 m

[patrol]
alt_m               = 5.0     # T-2: balloons are at 3 m and above
approach_speed_mps  = 3.0
search_yaw_rate_rps = 0.5
soft_margin_m       = 10.0    # T-5: slow down / curve inward from here
turn_margin_m       = 3.0     # abandon the target here
reach_range_m       = 3.0
alt_rate_mps        = 1.0
visited_cooldown_s  = 30.0
turn_dwell_s        = 3.0

[safety]
# Tighter than the closure profile: the whole range is 50 m across, so the
# speed and altitude limits are what a slow, observable trial needs.
vmax_h           = 4.0
vmax_v           = 1.5
geofence_r       = 60.0       # SM-3 radius, outside the polygon but still bounded
alt_min          = 2.0
alt_max          = 15.0
engage_timebox_s = 600.0      # a patrol sortie is long by design (SM-8)
bat_engage_min_frac = 0.40    # trials are repeatable; land early and swap packs
bat_land_frac       = 0.25

[supervisor]
blackbox = /var/log/riposte/blackbox.jsonl
