# Riposte runtime configuration (RIPOSTE-SAD-001) — PRODUCTION profile.
# Values here override the compiled defaults in common/include/riposte/Tunables.h.
#
# This is the file the systemd units deploy. Real backends are REQUIRED: with
# synthetic=false the seeker refuses to start when the Hailo detector or camera
# is unavailable, instead of silently substituting synthetic components.
# For hardware-free SIL development use config/sil.ini — do not flip this flag.

[seeker]
synthetic     = false         # true = SyntheticCamera+Detector (SIL); false = V4L2+Hailo
device        = /dev/video0
width         = 1280
height        = 720
hef           = config/model.hef
score_thr     = 0.40
nms_iou       = 0.45          # duplicate-box suppression threshold
# Network geometry EXPECTED before the HEF loads; init() overwrites both from the
# HEF's actual shapes, so a mismatch here is corrected rather than obeyed.
model_size    = 640           # square network input edge
model_classes = 1
hfov_rad      = 1.05          # ~60 deg horizontal FOV
target_size_m = 0.35          # assumed non-cooperative target drone span (monocular range)
target_class  = 0             # detector class id to track (balloon model differs)
# --- Search policy (RIPOSTE-DUALEO-REQ-001 R-5/R-6/R-7) ---
# Wide pass first; if nothing is found the frame is swept as a grid of tiles, one
# tile per frame, so a distant target reaches the model at native resolution
# instead of being resized below the detector's floor.
search_grid          = 3      # grid x grid tiles (3x3 = 9 tiles, ~0.3 s per sweep)
search_wide_dwell    = 2      # wide passes before falling back to the tile sweep
confirm_window       = 5      # R-6: sliding confirmation window, frames
confirm_hits         = 4      # R-6: hits required in it (4/5 = 80%)
track_recheck_period = 15     # R-7: full-frame re-detect every N frames in TRACK
track_roi_scale      = 4.0    # tracking ROI = target bbox size x this
track_roi_min        = 0.15   # ...but never narrower than this frame fraction
# R-10 close-range narrow-EO 60 Hz boost: within narrow_boost_range_m the wide
# recheck cadence stretches to track_recheck_period_near so the narrow channel
# runs nearly every frame; periodic AI re-detect still happens, just rarer.
narrow_boost_range_m      = 150.0  # 0 disables the boost
track_recheck_period_near = 90     # stretched R-7 cadence inside that range
# --- T1 embedding isolation (TRACKER-REQ TR-4, SEEKER-SDD S-12/§4.5) ---
# The RKNN embedder runs on its own thread; this is how long the perception
# thread waits for it before running the frame motion-only (T0, TR-3). A 60 Hz
# frame period is 16.6 ms — keep this well under it so a stalled NPU costs the
# deadline, never the capture cadence. Raise only after measuring the real INT8
# latency at bring-up.
embed_deadline_ms = 6.0
# --- Dual-EO perception (S-11/S-13, DUALEO-REQ P4) ---
# 1 = the narrow camera joins the INFERENCE schedule (search: wide/narrow
# alternating, TRACK: narrow with periodic wide re-detect). Requires the narrow
# camera to open — the seeker refuses to start wide-only, because that would
# deliver none of the narrow channel's range while looking healthy. Needs the
# geometry below; calibrate the offsets per airframe (DUALEO-REQ 3.6).
# The recording-only narrow channel is a separate switch (record_dual).
dual_eo               = 0
narrow_hfov_rad       = 0.269  # ~15.4 deg (LENS L-N1); must be < hfov_rad
channel_offset_az_rad = 0.0    # narrow bearing = wide bearing minus this
channel_offset_el_rad = 0.0    # 0 = perfectly coaxial axes (calibrate on the airframe)
# --- Video recording (H.264/MP4, 30 s segments, disk auto-reclaim) ---
record          = false       # true = record the camera stream to MP4
record_dir      = /var/lib/riposte/rec
record_segment_s = 30         # seconds per file
record_disk_high = 0.80       # evict oldest files once volume is 80% full
record_disk_free = 0.10       # reclaim ~10% of capacity when evicting
record_codec    = libx264     # -c:v; use h264_rkmpp for RK3588 hardware encode
record_fps      = 30
record_ffmpeg   = ffmpeg      # encoder binary (PATH or absolute)
# --- Dual EO recording: one file, wide=Ch1(left)/narrow=Ch2(right) + subtitle.
# The second channel is the DUALEO narrow-angle EO camera (S-11); recording
# only today — narrow inference lands with P4. (IR channel: future item.)
record_dual     = false       # true = composite wide|narrow side-by-side into one MP4
record_overlay  = true        # burn-in subtitle: time / GPS / per-channel detection px
narrow_device   = /dev/video1 # narrow-EO (Ch2) V4L2 device (ignored when synthetic)

[obc]
# OBC connects to the local mavlink-router endpoint, never the FC directly.
connection_url = udpin://0.0.0.0:14540
# Velocity path: hover | constant | circle | guidance | mission | balloon
# Attitude path (pitch/yaw): attitude (track tracking) | attitude_test (fixed cmd)
source         = mission
operator_token =              # REQUIRED for engage (D-2). Empty => engage denied.
rt_priority    = 80           # SCHED_FIFO priority (needs CAP_SYS_NICE)
cpu_affinity   = 4            # pin control loop to an A76 big core; -1 disables
# --- Attitude control (used when source = attitude / attitude_test) ---
att_pitch_deg      = 0.0      # attitude_test: fixed nose pitch (deg, +up)
att_yaw_deg        = 0.0      # attitude_test: fixed heading (deg)
att_roll_deg       = 0.0      # attitude_test: fixed roll (deg)
att_thrust         = 0.50     # attitude_test: collective thrust [0..1]
att_hover_thrust   = 0.50     # tracking: hover thrust baseline
att_track_pitch_deg = 15.0  # tracking: forward nose-down lean toward target
att_thrust_elev_gain  = 0.15  # tracking: thrust bias per unit target elevation

[mission]
# Scenario: tablet/external target cue -> takeoff -> hover -> transit -> seeker approach
# -> hold at cue -> return home + landing after operator timeout.
takeoff_alt_m       = 20.0
takeoff_rate_mps    = 1.5
cruise_speed_mps    = 5.0
hover_radius_m      = 3.0
search_radius_m     = 12.0
land_rate_mps       = 0.8
land_alt_m          = 0.35
hover_settle_s      = 3.0
operator_timeout_s  = 60.0
target_stale_s      = 120.0

[fence]
# SM-10 test boundary (RIPOSTE-DUALEO-REQ-001 T-1). Resolved to local NED at
# ENGAGE, so the square form is centred on wherever the control session started.
# The polygon form wins when set and needs >= 3 surveyed vertices plus a FRESH
# GPS fix at engage — without one the engage is REFUSED, not run with SM-10
# disabled (CR-04): configuring a boundary is a decision to fly inside it;
# without a fix SM-10 stays disabled rather than inventing a boundary.
#   polygon = 37.1234,127.1234; 37.1238,127.1234; 37.1238,127.1239; 37.1234,127.1239
polygon =
side_m  = 0                   # 0 = no square fence; the balloon trial uses 50

[patrol]
# Balloon patrol behaviour (source = balloon). Requires a [fence].
alt_m               = 5.0     # patrol altitude (T-2: balloons fly at 3 m and up)
approach_speed_mps  = 3.0     # gentle: the range is only 50 m across
search_yaw_rate_rps = 0.5     # in-place yaw sweep while looking for a balloon
soft_margin_m       = 10.0    # T-5: start slowing/curving inward this far from the edge
turn_margin_m       = 3.0     # ...and abandon the target entirely at this point
reach_range_m       = 3.0     # close enough to count the balloon as serviced
alt_rate_mps        = 1.0     # climb/descend rate holding patrol altitude
visited_cooldown_s  = 30.0    # ignore a serviced track id for this long
turn_dwell_s        = 3.0     # minimum time spent turning away before searching

[safety]
vmax_h          = 8.0
vmax_v          = 3.0
geofence_r      = 150.0
alt_min         = 2.0
alt_max         = 60.0
engage_timebox_s = 300.0       # SM-8
# SM-1 field-level bound for low-rate telemetry streams (mode/armed/global
# position/EKF health/battery, ~1 Hz heartbeat derived). Must be >= the 500 ms
# position bound; a stopped stream is caught within this window (P0-04).
telem_flag_stale_s = 3.0
att_max_tilt_deg = 35.0       # SM-4: max |roll|,|pitch| in attitude mode
att_min_thrust   = 0.10       # SM-4: never command motors fully off
att_max_thrust   = 0.80       # SM-4: cap climb authority
# SM-9 battery gate. Remaining-capacity FRACTIONS 0..1 (not percent); 0 disables.
# Engage is also denied while the battery is UNREADABLE. PX4's own low-battery
# failsafe (COM_LOW_BAT_ACT) remains the final layer below these.
bat_engage_min_frac = 0.30    # READY: deny engage below 30% remaining
bat_land_frac       = 0.20    # in flight: disengage below 20% remaining

[supervisor]
blackbox = /var/log/riposte/blackbox.jsonl
; Retention: rotate blackbox at this size, keeping this many numbered archives
; (base.1..base.N). On-disk bound ~= (keep+1) * max_bytes. Set keep=0 to truncate.
blackbox_max_bytes = 16777216
blackbox_keep = 5
