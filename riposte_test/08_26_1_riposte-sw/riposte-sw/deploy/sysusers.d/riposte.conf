# systemd-sysusers(8) — install to /usr/lib/sysusers.d/ (or run
# `systemd-sysusers riposte.conf` once at provisioning).
#
# Service account for the riposte-* units (they must not run as root): shm
# buses, the /run/riposte command socket, recordings and the blackbox are all
# owned by this user. Operators who use the engage CLI join group `riposte`
# to reach the 0660 command socket.
u riposte - "Riposte mission computer" /opt/riposte -
