# Riposte OBC — PX4 SITL smoke test configuration (test/sitl/run_sitl_test.sh)
[obc]
connection_url = udpin://0.0.0.0:14540
source = hover
operator_token = sitl-test-token
cmd_socket = /tmp/riposte-obc.sock
rt_priority = 0
cpu_affinity = -1

[safety]
