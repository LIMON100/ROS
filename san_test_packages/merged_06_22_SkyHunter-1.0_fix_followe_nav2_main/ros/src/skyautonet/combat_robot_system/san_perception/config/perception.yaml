perception_node:
  ros__parameters:
    # NPU
    npu_backend:           "stub"        # "stub" | "rknn"
    model_path:            ""            # /opt/san/models/yolov8n.rknn
    input_width:           640
    input_height:          640
    stub_on_no_npu:        true

    # Post-processing
    min_confidence:        0.4
    iou_threshold:         0.5

    # Calibration — RGB (IMX678 4K)
    rgb_fx:                1500.0
    rgb_fy:                1500.0
    rgb_cx:                1920.0
    rgb_cy:                1080.0
    rgb_width:             3840
    rgb_height:            2160

    # Calibration — Thermal (640x512)
    thermal_fx:            300.0
    thermal_fy:            300.0
    thermal_cx:            320.0
    thermal_cy:            256.0
    thermal_width:         640
    thermal_height:        512

    # Stereo baseline (RGB→thermal, x-axis)
    stereo_baseline_m:     0.10
