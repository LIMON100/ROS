routes:
  - name: "floor_1_safety"
    floor: 1
    schedule: ["06:00", "10:00", "14:00", "18:00"]
    waypoints:
      - id: "P1-entrance"
        pose:
          position: [5.0, 2.0, 0.0]
          orientation: [0, 0, 0, 1]
        dwell_sec: 30.0
        checks: ["ppe", "unauthorized_access"]
      - id: "P1-stairs-bottom"
        pose:
          position: [12.0, 8.0, 0.0]
          orientation: [0, 0, 0.707, 0.707]
        dwell_sec: 30.0
        checks: ["guardrail", "open_hole"]
      - id: "P1-material-storage"
        pose:
          position: [18.0, 15.0, 0.0]
          orientation: [0, 0, 1, 0]
        dwell_sec: 45.0
        checks: ["stacking_safety", "blocked_path"]
      - id: "P1-exit"
        pose:
          position: [3.0, 18.0, 0.0]
          orientation: [0, 0, 0, 1]
        dwell_sec: 20.0
        checks: ["ppe"]

  - name: "floor_2_night"
    floor: 2
    schedule: ["22:00", "02:00"]
    waypoints:
      - id: "P2-corridor-A"
        pose:
          position: [4.0, 5.0, 3.0]
          orientation: [0, 0, 0, 1]
        dwell_sec: 30.0
        checks: ["intrusion"]
