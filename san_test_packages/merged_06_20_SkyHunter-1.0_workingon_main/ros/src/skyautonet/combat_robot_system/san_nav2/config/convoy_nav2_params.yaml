# Convoy per-UGV Nav2 params (DCN-2026-029 P2) — single-source reuse of san_nav2.
#
# san_nav2/config/nav2_params.yaml 을 convoy POC 추종자(UGV) 용으로 좁힌 변형이다.
# "reuse, do not fork"(DCN-2026-029 §3): 컨트롤러/플래너/costmap 플러그인은 san_nav2 와
# 동일하게 유지하고, convoy 특화 부분만 바꾼다:
#   - AMCL 제거: sim 은 지상진실. map→odom 은 런처 static_transform_publisher(identity),
#     odom→base_footprint 는 convoy_odom_tf 중계(지상진실 odom). 실HW 는 san_localization
#     dual-EKF 가 동일 tf 를 만든다(별 변경 없이 본 params 재사용 가능).
#   - frame/topic 네임스페이스: convoy_nav2.launch.py 가 로봇별로 robot_<id>/ 를 주입
#     (frames) + RewrittenYaml(root_key=ns)로 노드에 바인딩. 여기 frame 은 평문(map/odom/
#     base_footprint), odom_topic/scan 토픽은 상대명으로 둔다.
#   - 속도: convoy 평시 ~0.6 m/s(리더 vmax 정합)로 하향.
#
# O-1(DCN-2026-029 §9, 미결): 컨트롤러는 san_nav2 의 RegulatedPurePursuitController(RPP)를
#   계승한다 — 참조경로(breadcrumb 차선) FollowPath 추종에 자연스럽고 in-repo 실증됨.
#   DWB/MPPI 벤치마크는 P2 에서 실측 후 확정(본 파일 컨트롤러 블록 교체로 전환).
# O-2(미결): tf 트리. 본 params 는 map→odom→base_footprint 가 존재한다고 가정(위 shim).

# --- BT Navigator ---
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 5
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

# --- Controller Server (Regulated Pure Pursuit — O-1 계승, DWB/MPPI 후보) ---
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.6          # convoy 평시 속도(리더 vmax 정합)
      lookahead_dist: 1.0
      min_lookahead_dist: 0.4
      max_lookahead_dist: 2.0
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.8
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      allow_reversing: false
      max_angular_accel: 1.5
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

# --- Planner Server (SmacPlanner2D — san_nav2 계승) ---
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      # pluginlib lookup 명은 '::' 형식(슬래시 'nav2_smac_planner/SmacPlanner2D' 는
      # 미등록 → planner_server FATAL). base nav2_params.yaml 에도 같은 잠재 버그 존재.
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 2.0
      use_final_approach_orientation: false
      cost_travel_multiplier: 1.0
      cost_penalty_multiplier: 1.5

# --- Global Costmap (rolling, no static map — convoy 는 리더 참조 추종) ---
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      rolling_window: true
      width: 40
      height: 40
      resolution: 0.1
      track_unknown_space: false
      # UGV 풋프린트(san_description 실모델 트랙 기준; 보수적 사각).
      footprint: "[[0.35, 0.25], [0.35, -0.25], [-0.35, -0.25], [-0.35, 0.25]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        observation_sources: pointcloud
        pointcloud:
          # 상대명 → 런처가 /robot_<id>/scan/points 로 네임스페이스. convoy UGV 는 기본
          # lidar_mode=none → 무발행(빈 costmap, 안전). P2 검증 시 UGV lidar 활성 필요.
          topic: scan/points
          data_type: "PointCloud2"
          min_obstacle_height: 0.3      # 지면 비표시
          max_obstacle_height: 2.5
          obstacle_max_range: 25.0
          raytrace_max_range: 30.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 1.0

# --- Local Costmap (rolling, odom frame) ---
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[0.35, 0.25], [0.35, -0.25], [-0.35, -0.25], [-0.35, 0.25]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        observation_sources: pointcloud
        pointcloud:
          topic: scan/points
          data_type: "PointCloud2"
          min_obstacle_height: 0.3
          max_obstacle_height: 2.5
          obstacle_max_range: 25.0
          raytrace_max_range: 30.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.8

# --- Behavior Server (recovery: spin/backup/drive_on_heading/wait) ---
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    # Jazzy pluginlib: '::' lookup 명 필수(슬래시 형식은 미등록 → behavior_server FATAL).
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.5

# --- Waypoint Follower ---
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

# --- Smoother Server ---
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
