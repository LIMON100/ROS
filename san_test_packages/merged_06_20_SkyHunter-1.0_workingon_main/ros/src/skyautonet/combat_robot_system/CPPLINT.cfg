# cpplint configuration for the SkyAutoNet combat_robot_system tree.
# cpplint walks up from each linted file and applies the nearest cfg,
# so this single file governs every package below it.
#
# The categories below are disabled deliberately: they flag a Google
# C++ style convention that this codebase does not follow, not real
# defects. Re-enabling any of them would require a large mechanical
# refactor (e.g. reordering includes across the whole tree) with no
# correctness benefit and a non-trivial risk of breaking translation
# units that rely on the current include order.
#
#   build/include_order        — related/C/C++/other ordering rule
#   build/namespaces           — anonymous-namespace placement style
#   runtime/int               — int vs fixed-width int (intN_t) preference
#   build/include_what_you_use — transitive-include suggestions (compiles fine)
filter=-build/include_order,-build/namespaces,-runtime/int,-build/include_what_you_use
