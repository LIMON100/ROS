# SQM cake — egress shaping for the WAN uplink. Honors the DSCP
# marks applied by scripts/apply_dscp_marking.sh so EF (predictive
# control) gets priority queueing while AF21 (video) shares the
# best-effort tin without crowding it out.

config queue 'wan_cake'
    option enabled '1'
    option interface 'wan'
    option download '90000'        # kbps — saturate 100 Mbps wired
    option upload '90000'
    option qdisc 'cake'
    option script 'piece_of_cake.qos'
    option qdisc_advanced '1'
    option squash_dscp '0'         # preserve DSCP marks downstream
    option squash_ingress '0'
    option ingress_ecn 'ECN'
    option egress_ecn 'NOECN'
    option qdisc_really_really_advanced '1'
    option iqdisc_opts 'diffserv8 dual-srchost nat'
    option eqdisc_opts 'diffserv8 dual-dsthost nat'

config queue 'wan_lte_cake'
    option enabled '1'
    option interface 'wan_lte'
    option download '20000'        # kbps — conservative LTE cap
    option upload '5000'
    option qdisc 'cake'
    option script 'piece_of_cake.qos'
    option qdisc_advanced '1'
    option squash_dscp '0'
    option squash_ingress '0'
    option ingress_ecn 'ECN'
    option egress_ecn 'NOECN'
    option qdisc_really_really_advanced '1'
    option iqdisc_opts 'diffserv8 dual-srchost nat'
    option eqdisc_opts 'diffserv8 dual-dsthost nat'
