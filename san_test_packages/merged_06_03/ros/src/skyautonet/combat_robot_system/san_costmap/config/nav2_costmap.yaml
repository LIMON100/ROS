# SAN v1.3 PHASE 1 — cost_map_node + Nav2 local_costmap parameters.

cost_map_node:
  ros__parameters:
    width:  280                       # 14 m × 14 m grid
    height: 280
    resolution_m: 0.05                # 5 cm
    origin_x: -7.0                    # robot centered
    origin_y: -7.0
    kpp_latency_target_s: 5.0
    robot_id: "0"
    obstacle_topic: "/san/lidar/obstacles"
    ground_topic:   "/san/lidar/ground"
    update_period_ms: 500             # ★ v1.5.1 (DCN-2026-003 D-002): 1 Hz → 2 Hz layer refresh
    publish_period_ms: 100            # 10 Hz publish

# Nav2 layered_costmap_2d local_costmap profile (mounted alongside
# cost_map_node when integrating with Nav2 DWB local planner).
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width:  14
      height: 14
      resolution: 0.05
      robot_radius: 0.85              # max(W, L) / 2 + safety
      plugins:
        - "obstacle_layer"
        - "traversability_layer"
        - "inflation_layer"
      inflation_layer:
        inflation_radius: 1.0         # √(1.3² + 0.85²)/2 + safety
        cost_scaling_factor: 3.0
