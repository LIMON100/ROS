swarm_coordinator:
  ros__parameters:
    # role: leader | follower
    role: leader
    robot_id: 1
    leader_robot_id: 1

    # Default relay targets when the tablet/app has not sent selected_robot_ids.
    # The leader skips its own robot_id unless relay_to_self is true.
    default_target_robot_ids: [1, 2, 3, 4, 5, 6, 7, 8]
    relay_to_self: false

    heartbeat_period_ms: 200
    heartbeat_timeout_ms: 1000

    robot_topic_prefix: "/swarm"
    # Follower-local relay outputs become /swarm/follower/sN/command and /swarm/follower/sN/status.
    follower_output_prefix: "/swarm/follower"
    heartbeat_topic: "/swarm/leader/heartbeat"
