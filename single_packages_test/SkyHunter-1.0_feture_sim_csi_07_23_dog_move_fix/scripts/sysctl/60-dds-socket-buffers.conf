# DDS(UDP) 소켓 버퍼 영구 설정
# ==================================
# 목적: 대용량 BestEffort 토픽(LiDAR /rslidar_points PointCloud2 10Hz 등)이
#       버스트에서 단편 손실로 드롭되지 않도록 커널 UDP 수신/송신 버퍼를 키운다.
#
# 핵심:
#   - rmem_max / wmem_max = 천장(ceiling). DDS 가 요청할 수 있는 최대치.
#   - rmem_default / wmem_default = DDS 가 버퍼 크기를 0(자동)으로 둘 때 실제로
#     잡히는 기본값.
#   FastDDS 는 transport buffer 를 명시하지 않으면 *default* 값을 따라가므로,
#   default 도 함께 올려야 한다. (fastdds_profile.xml 로 16MB 를 명시하면 그쪽이
#   우선이지만, 천장(max)이 그보다 작으면 잘려서 반영되므로 max 는 필수.)
#
# 적용:
#   sudo cp scripts/sysctl/60-dds-socket-buffers.conf /etc/sysctl.d/
#   sudo sysctl --system        # 즉시 반영 + 재부팅 후에도 유지
# 확인:
#   sysctl net.core.rmem_max net.core.rmem_default net.core.wmem_max net.core.wmem_default

# 천장: 64MB (fastdds_profile.xml 의 16MB 요청을 충분히 수용)
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864

# 기본값: 16MB (버퍼를 명시하지 않는 노드/툴도 충분한 버퍼 확보)
net.core.rmem_default = 16777216
net.core.wmem_default = 16777216
