navsat_transform:
  ros__parameters:
    use_sim_time: false
    frequency: 15.0  # 30→20→15Hz: 저사양보드 부하절감(ekf rate miss 억제). 컨트롤러보다 낮아도 저속(0.8m/s)엔 무방
    delay: 1.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_cartesian_transform: false
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: false
    base_link_frame: base_footprint
    world_frame: map