ekf_filter_node_odom:
  ros__parameters:
    use_sim_time: false
    frequency: 15.0  # 30→20→15Hz: 저사양보드 부하절감(ekf rate miss 억제). 컨트롤러보다 낮아도 저속(0.8m/s)엔 무방
    sensor_timeout: 1.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint 
    world_frame: odom

    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    imu0: /gps/heading_imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_queue_size: 10
    imu0_relative: false
    imu0_differential: false

    imu1: /imu/data
    imu1_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu1_queue_size: 10
    imu1_relative: false
    imu1_differential: true


